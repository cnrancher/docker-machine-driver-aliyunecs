name: Build and Release Pipeline

on:
  push:
    branches:
      - main
      - "release/v*.*"
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.goos }}-${{ matrix.goarch }} and export artifacts
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: artifact
          push: false
          build-args: |
            GOOS=${{ matrix.goos }}
            GOARCH=${{ matrix.goarch }}
            DRIVER_NAME=docker-machine-driver-aliyunecs
          outputs: type=local,dest=./output/${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Show output
        run: |
          find ./output/${{ matrix.goos }}-${{ matrix.goarch }} -maxdepth 3 -type f -print
          ls -la ./output/${{ matrix.goos }}-${{ matrix.goarch }}/out/bin || true

      - name: Upload artifacts (per-platform)
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            output/${{ matrix.goos }}-${{ matrix.goarch }}/out/bin/*.tgz

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      - name: Flatten files
        run: |
          mkdir -p ./dist
          find ./release-assets -type f -maxdepth 5 -print -exec cp -v {} ./dist/ \;
          ls -la ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
