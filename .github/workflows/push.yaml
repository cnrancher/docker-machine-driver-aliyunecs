name: Build and Release Pipeline

on:
  push:
    branches:
      - main
      - "release/v*.*"
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.goos }}-${{ matrix.goarch }} and export artifacts
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: artifact
          push: false
          build-args: |
            GOOS=${{ matrix.goos }}
            GOARCH=${{ matrix.goarch }}
            DRIVER_NAME=docker-machine-driver-aliyunecs
          outputs: type=local,dest=./output/${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Show output
        run: |
          find ./output/${{ matrix.goos }}-${{ matrix.goarch }} -maxdepth 3 -type f -print
          ls -la ./output/${{ matrix.goos }}-${{ matrix.goarch }}/out/bin || true

      - name: Upload artifacts (per-platform)
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            output/${{ matrix.goos }}-${{ matrix.goarch }}/out/bin/*.tgz

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: List artifacts for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[] | "\(.id)\t\(.name)\t\(.size_in_bytes)"'
      - name: Download all build artifacts (via gh)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./release-assets
          for a in \
            build-output-linux-amd64 \
            build-output-linux-arm64 \
            build-output-darwin-amd64 \
            build-output-darwin-arm64 \
            build-output-windows-amd64; do
            echo "Downloading $a"
            gh run download ${{ github.run_id }} -R ${{ github.repository }} -n "$a" -D ./release-assets
          done

      - name: Flatten files
        run: |
          mkdir -p ./dist
          find ./release-assets -type f -maxdepth 5 -print -exec cp -v {} ./dist/ \;
          ls -la ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
